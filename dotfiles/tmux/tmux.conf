# For vim, this makes ESC not lag
set -s escape-time 0

bind u source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display "Reloaded config"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g status-position top
set -g base-index 1
set -g pane-base-index 1
set -g status-left-length 30
set -g history-limit 50000
set -g display-time 3000
set -g status-interval 10

%hidden BG="#1d2021"
%hidden BG1="#3c3836"
%hidden BG2="#504945"
%hidden FG="#ebdbb2"
%hidden GRAY="#a89984"
%hidden GREEN="#b8bb26"
%hidden DGREEN="#79740e"
%hidden BLUE="#83a598"
%hidden YELLOW="#fabd2f"
%hidden ORANGE="#fe8019"
%hidden RED="#fb4934"

set -g status-style "bg=$BG,fg=$GRAY"
set -g window-status-style "fg=$GRAY,bg=$BG"
set -g window-status-current-style "bg=$GREEN,fg=$BG,bold"
set -g window-status-format " #I #[fg=$GRAY]│#[default] #W "
set -g window-status-current-format " #I #[fg=$DGREEN]│#[default] #W "
set -g status-left "#[bg=#{?client_prefix,$YELLOW,$BLUE},fg=$BG,bold] #S #[default] "
set -g status-right "#[bg=$BG1,fg=$FG] %a %d %b  %H:%M #[default]"

set -g pane-border-style "fg=$BG1"
set -g pane-active-border-style "fg=$GREEN"
set -g message-style "bg=$BG1,fg=$YELLOW"
set -g message-command-style "bg=$BG1,fg=$ORANGE"
set -g mode-style "bg=$BG2,fg=$FG"
set -g clock-mode-color "$GREEN"
set -g display-panes-active-color "$GREEN"
set -g display-panes-color "$BG2"
set -g window-status-activity-style "fg=$ORANGE"
set -g window-status-bell-style "fg=$RED,bold"

bind "\\" split-window -hc "#{pane_current_path}"
bind "|" split-window -fhc "#{pane_current_path}"
bind "-" split-window -vc "#{pane_current_path}"
bind "_" split-window -fvc "#{pane_current_path}"

bind S command-prompt -p "New Session:" "new-session -As '%%'"
bind K confirm kill-session

##### vim-tmux integration #####
vim_pattern='^(g?(view|n?vim?x?)(diff)?|fzf)$'
is_vim="#{m/ri:${vim_pattern},${pane_current_command}}"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
